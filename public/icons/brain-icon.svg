<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EEFD"/>
      <stop offset="50%" stop-color="#FFE8EC"/>
      <stop offset="100%" stop-color="#E4DCF9"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="50%" stop-color="#FF758F"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative stars -->
  <circle cx="100" cy="110" r="14" fill="#FFC2D1" opacity="0.8"/>
  <circle cx="410" cy="140" r="18" fill="#D8BBFF" opacity="0.7"/>
  <circle cx="390" cy="390" r="12" fill="#FFB3C6" opacity="0.8"/>
  <circle cx="110" cy="380" r="15" fill="#C8B6FF" opacity="0.7"/>
  <polygon points="120,70 124,80 134,84 124,88 120,98 116,88 106,84 116,80" fill="#FFB703"/>
  <polygon points="400,90 404,100 414,104 404,108 400,118 396,108 386,104 396,100" fill="#FFB703"/>

  <!-- Brain Mascot Body -->
  <!-- Left Hemisphere Lobes -->
  <g filter="url(#softGlow)">
    <circle cx="210" cy="200" r="65" fill="url(#brainGrad)" />
    <circle cx="170" cy="260" r="62" fill="url(#brainGrad)" />
    <circle cx="220" cy="320" r="65" fill="url(#brainGrad)" />
    
    <!-- Right Hemisphere Lobes -->
    <circle cx="302" cy="200" r="65" fill="url(#brainGrad)" />
    <circle cx="342" cy="260" r="62" fill="url(#brainGrad)" />
    <circle cx="292" cy="320" r="65" fill="url(#brainGrad)" />
    
    <!-- Central blend -->
    <rect x="190" y="210" width="132" height="110" rx="40" fill="url(#brainGrad)" />
  </g>

  <!-- Brain Folds (Cute Pink lines) -->
  <path d="M 180 200 Q 210 230 190 260" stroke="#FFF0F3" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 332 200 Q 302 230 322 260" stroke="#FFF0F3" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 215 320 Q 256 340 297 320" stroke="#FFF0F3" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 256 165 L 256 340" stroke="#FF5376" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/>

  <!-- Cute Eyes -->
  <circle cx="215" cy="255" r="14" fill="#3D314A" />
  <circle cx="297" cy="255" r="14" fill="#3D314A" />
  <!-- Eye Sparkles -->
  <circle cx="219" cy="251" r="5" fill="#FFFFFF" />
  <circle cx="301" cy="251" r="5" fill="#FFFFFF" />
  <circle cx="212" cy="259" r="2.5" fill="#FFFFFF" />
  <circle cx="294" cy="259" r="2.5" fill="#FFFFFF" />

  <!-- Cute Blush Cheeks -->
  <ellipse cx="178" cy="275" rx="14" ry="9" fill="#FF4D6D" opacity="0.45" />
  <ellipse cx="334" cy="275" rx="14" ry="9" fill="#FF4D6D" opacity="0.45" />

  <!-- Happy Smile -->
  <path d="M 240 278 Q 256 295 272 278" stroke="#3D314A" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Little Angel Halo or Antenna -->
  <path d="M 256 150 L 256 120" stroke="#735DA5" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="115" r="12" fill="#FFD166" />
  <path d="M 230 115 Q 256 95 282 115" stroke="#FFE3A8" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Little Red Heart on top -->
  <path d="M 256 95 C 250 85, 235 85, 235 100 C 235 112, 256 122, 256 122 C 256 122, 277 112, 277 100 C 277 85, 262 85, 256 95 Z" fill="#E63946"/>
</svg>
